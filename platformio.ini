[platformio]
default_envs = esp32c6-mock

; DevKitC-1 defaults are assumed for the replacement board.
; esptool identified an ESP32-C6 with 16 MB flash on the CH343 connection.
[env:esp32c6-mock]
platform = espressif32@6.13.0
board = esp32-c6-devkitc-1
framework = espidf
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.cmake_extra_args = -DCATFEEDER_ESP_IDF=ON
board_build.esp-idf.sdkconfig_path = ${platformio.workspace_dir}/sdkconfig.esp32c6-mock
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
board_build.embed_txtfiles = web/index.html
board_build.partitions = partitions.csv

; Initial profile for the reported ESP32 DevKit V1 / clone with WROOM-32.
; Retained for the original board, which was not detected during upload bring-up.
[env:esp32-mock]
platform = espressif32@6.13.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_flags = -I simulation
build_src_filter = +<Controller.cpp> +<esp32_main.cpp>
